<html>

<head>
    <title>FlipClock_Mine</title>
    <link rel="stylesheet" href="flipclock.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

<body>
    <header>
        <div class="hcontent">
            <p>Flip Clock </p>
        </div>
    </header>
    <div class="main">
        <div class="left">
            <h3 class="ddmmyy">
                <span id="dd"></span>/
                <span id="mm"></span>/
                <span id="yy"></span>
            </h3>
            <div>
                <h1 id="hh">12</h1>
            </div>
            <div class="meri">
                <h3 id="ampm">PM</h3>
            </div>
        </div>
        <div class="separator">
            <h1>:</h1>
        </div>
        <div class="right">
            <div>
                <h3 id="ww"></h3>
            </div>
            <div>
                <h1 id="min">00</h1>
            </div>
            <div class="ss">
                <h3 id="sec">00</h3>
            </div>
        </div>
    </div>
    <footer>
        <div class="fcontent">
            <blockquote> "Great minds discuss ideas; average minds discuss events; small minds discuss
                people.”
            </blockquote>
            <cite>Eleanor Roosevelt</cite>
        </div>
    </footer>
    <script src="Flipclock.js"></script>
</body>

</html>
