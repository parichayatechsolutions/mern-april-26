<html>
<head>
    <title>FlipClock_Mine</title>
    <link rel="stylesheet" href="Flipclock.css">
</head>
<body>
    <div class="main">
        <div class="left">
            <div>
                <h3 class="ddmmyy">
                    <span id="dd"></span>/
                    <span id="mm"></span>/
                    <span id="yy"></span>
                </h3>
            </div>
            <div>
                <h1 id="hour">12</h1>
            </div>
            <div class="am_pm">
                <h3 id="ampm">PM</h3>
            </div>
        </div>
        <div class="right">
            <div>
                <h3 id="dayOfWeek"></h3>
            </div>
            <div>
                <h1 id="min">00</h1>
            </div>
            <div class="seconds">
                <h3 id="sec">00</h3>
            </div>
        </div>
    </div>
    <script src="Flipclock.js"></script>
</body>
</html>
