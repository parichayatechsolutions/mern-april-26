<html>

<head>
    <title>javascript</title>
    <link rel="stylesheet" href="js.css">
</head>

<body>
    <div class="container">
        <div class="add">
            <div>
                <h3>hello world!</h3>
            </div>
            <h3 id="demo"></h3>
        </div>
        <div class="add">
            <div>
                <h3>values</h3>
            </div>
            <h3 id="a"></h3>
            <h3 id="b"></h3>
        </div>
        <div class="add">
            <div>
                <h3>addition</h3>
            </div>
            <h3 id="c"></h3>
        </div>
        <div class="add">
            <div>
                <h3>multiplication</h3>
            </div>
            <h3 id="d"></h3>
        </div>
        <div class="add">
            <div>
                <h3>division</h3>
            </div>
            <h3 id="e"></h3>
        </div>
        <div class="add">
            <div>
                <h3>subtraction</h3>
            </div>
            <h3 id="f"></h3>
        </div>
        <div class="add">
            <div>
                <h3>modulus</h3>
            </div>
            <h3 id="g"></h3>
        </div>
        <div class="add">
            <div>
                <h3>exponentiation</h3>
            </div>
            <h3 id="h"></h3>
        </div>
        <div class="add">
            <div>
                <h3>increment</h3>
            </div>
            <h3 id="i"></h3>
        </div>
        <div class="add">
            <div>
                <h3>decrement</h3>
            </div>
            <h3 id="j"></h3>
        </div>
    </div>
    <div class="room">
        <div class="H">
            <button type="button" onclick="document.getElementById('img').src='./happy.gif'">click me if you are
                sad</button>
        </div>
        <img id="img" src="./unknown.gif" alt="Happy?Sad?" />
        <div class="S">
            <button type="button" onclick="document.getElementById('img').src='./silent.gif'">click me if you are
                very happy</button>

        </div>
    </div>
    <div class="condition">
        <div class="ifc">
            <div>
                <h3>if</h3>
            </div>
            <input type="number" id="ifinput" placeholder="enter a number">
            <button type="button" onclick="myIf()">click</button>
            <h3 id="if"></h3>
        </div>
        <div class="ifel">
            <div>
                <h3>if-else</h3>
            </div>
            <input type="number" id="ifelinput" placeholder="enter a number">
            <button type="button" onclick="myIfElseIf()">click</button>
            <h3 id="ifelif"></h3>
        </div>
        <div class="switch">
            <div>
                <h3>switch</h3>
            </div>
            <input type="number" id="switchinput" placeholder="enter a number between 0-6">
            <button type="button" onclick="mySwitch()">click</button>
            <h3 id="switchresult"></h3>
        </div>
    </div>
    <button type="button" onclick="document.write('Welcome to JavaScript')">Try it</button>
    <script src="basic.js"></script>
    <br><button onclick="window.print()">Print this page</button>
</body>

</html>
