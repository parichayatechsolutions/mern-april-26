<html>

<head>
    <title>Flip Clock</title>
    <link rel="stylesheet" href="flip.css">
    <link rel="stylesheet" href="animate.css">
</head>

<body class="dark">
    <div class="flip-clock">
        <div class="left">
            <div>
                <h2 id="d">
                    <span id="date"></span>-
                    <span id="month"></span>-
                    <span id="year"></span>
                </h2>
            </div>
            <div>
                <h1 id="hour"></h1>
            </div>
            <div>
                <h3 id="am_pm"></h3>
            </div>
        </div>
        <div class="right">
            <div>
                <div class="dl">
                    <select id="changetheme" onchange="changeTheme(this.value)">
                        <option value="dark">Dark Theme</option>
                        <option value="light">Light Theme</option>
                    </select>
                </div>
                <h2 id="dn"></h2>
            </div>
            <div>
                <h1 id="min"></h1>
            </div>
            <div>
                <h3 id="sec"></h3>
            </div>
        </div>
        <script src="flip.js"></script>
</body>

</html>
