<html>

<head>
    <title>FlipClock</title>
    <link rel="stylesheet" href="Flipclock.css">
</head>

<body>
    <div class="flip-clock">
        <div class="left">
            <div>
                <h3 class="date">
                    <span id="day"></span>/
                    <span id="month"></span>/
                    <span id="year"></span>
                </h3>
            </div>
            <div>
                <h1 id="hour">12</h1>
            </div>
            <div class="am_pm">
                <h3 id="ampm">PM</h3>
            </div>
        </div>
        <div class="right">
            <div>
                <h3 id="dayOfWeek"></h3>
            </div>
            <div>
                <h1 id="min">00</h1>
            </div>
            <div class="seconds">
                <h3 id="sec">00</h3>
            </div>
        </div>
    </div>
    <!-- <button onclick="stopClock()">Stop Clock   </button> -->
    <script src="Flipclock.js"></script>

</body>

</html>
