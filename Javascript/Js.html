<!DOCTYPE html>
<html>

<head>
    <title>Javascript</title>
    <link rel="stylesheet" href="Js.css">
</head>

<body>
    <p id="demo">Hiiii</p>
    <button type="button" onclick="myFunction()">Click here</button><br>
    <p> I have a message for you</p>
    <button type="button" onclick="document.write('Tadowwww Surpriseeee')">Try it</button>
    <p> Let's check for date and time</p>
    <button type="button" onclick="myTime()">Click me to display Date and Time.</button>
    <p id="demo1"></p>
    <p>Let's have some fun!</p>
    <button onclick="img()">Click here to color me</button>

    <img id="myImage" src="./dog1.jpg" style="width:100px">

    <button onclick="img2()">Click here to fade my color</button><br>
    <div>
        <h3>Operators:</h3>
    </div>
    <div class="operator">
        <div class="addition">
            <h3>Add</h3>
            <button type="button" onclick="add()">Click here to add 15 and 25</button><br>
            <p id="demo2"></p>
        </div>
        <div class="subtraction">
            <h3>Sub</h3>
            <button type="button" onclick="sub()">Click here to sub 45 and 25</button><br>
            <p id="demo4"></p>
        </div>
        <div class="concate">
            <h3>Concate</h3>
            <button type="button" onclick="concate()">Click here to concate </button><br>
            <p id="demo3"></p>
        </div>
        <div class="increement">
            <h3>Increement</h3>
            <button type="button" onclick="increement()">Click here to increement 5 </button><br>
            <p id="demo5"></p>
        </div>
        <div class="exponent">
            <h3>Exponent</h3>
            <button type="button" onclick="exponent()">Click here to get exponent of 5 </button><br>
            <p id="demo6"></p>
        </div>
        <div class="spread">
            <h3>Min-max</h3>
            <button type="button" onclick="spread()">Click here to get min max </button><br>
            <p id="demo7"></p>
        </div>
        <div class="compare">
            <h3>Comparision</h3>
            <button type="button" onclick="compare()">Click here to compare 20 and 5</button><br>
            <p id="demo8"></p>
        </div>
        <div class="div-assign">
            <h3>Division Assignment</h3>
            <button type="button" onclick="div_assign()">Click here to divide and assign value</button><br>
            <p id="demo9"></p>
        </div>
    </div>
    <div>
        <h3>Conditional Statements:</h3>
    </div>
    <div class="conditional">
        <div class="drive">
            <h3>Driving Eligibilty</h3>
            <input type="number" id="ageInput" placeholder="Enter your age">
            <button type="button" onclick="drive()">Click to know ur driving eligibility</button>
            <p id="demo10"></p>
        </div>
        <div class="time">
            <h3>Enter Time</h3>
            <input type="number" id="timeInput" >
            <button type="button" onclick="time()">Click to know time</button>
            <p id="demo11"></p>
        </div>
        <div class="age">
            <h3>Enter Age</h3>
            <input type="number" id="ageInput" placeholder="Enter your age">
            <button type="button" onclick="age()">Click to know ur age</button>
            <p id="demo12"></p>
        </div>
        <div class="rainbow">
            <h3>Enter Rainbow Color </h3>
            <input type="text" id="colorInput" placeholder="Enter color">
            <button type="button" onclick="rainbow()">Click to get color </button>
            <p id="demo13"></p>
        </div>



    </div>
    <script src="basic.js"></script>
</body>


</html>
