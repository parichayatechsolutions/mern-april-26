<html>

<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="l.css">
</head>

<body>
    <div class="main">
        <div class="page">
            <div class="left">
                <form>
                    <div class="heading">
                        <h2>Welcome to Login Page</h2>
                    </div>
                    <div class="form">
                        <label>Name</label>
                        <input type="text" placeholder="Your name"></input>
                        <label>E-mail</label>
                        <input type="e-mail" placeholder="E-mail"></input>
                        <label>Password</label>
                        <input type="password" placeholder="Password"></input>
                    </div>
                    <div class="mid">
                        <div class="l_l">
                            <input type="checkbox" id="check"></input>
                            <label>Keep me logged in</label>
                        </div>
                        <div class="l_r">
                            <a href="l.html"">Forgot Password</a>
                    </div>
                </div>
                <div class=" btn">
                                <button type="submit">
                                    <span>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="#ffffff" width="15px" height="15px"
                                        viewBox="0 0 32 32" version="1.1">
                                        <title>paper-plane</title>
                                        <path
                                            d="M0 14.016l9.216 6.912 18.784-16.928-14.592 20.064 10.592 7.936 8-32zM8 32l6.016-4-6.016-4v8z" />
                                    </svg>
                                </span>Log in
                                </button>
                        </div>
                        <div class="footer">
                            <p>Don't have account? <a href="sign.html">Sign in</a></p>
                        </div>
                </form>
            </div>
            <div class="right">
                <img src="./clipart.jpg">
            </div>
        </div>
    </div>
</body>

</html>
